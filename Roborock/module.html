<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181824; color: #fff; padding: 20px; border-radius: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 18px; font-weight: 600;">Roborock Qrevo Curv</h3>
        <span id="badge-status" style="background: #2d2d44; padding: 4px 12px; border-radius: 20px; font-size: 12px; color: #10B981;">Bereit</span>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 15px 0;">
        <div style="background: #222233; padding: 12px; border-radius: 10px;">
            <div style="font-size: 11px; color: #888; text-transform: uppercase;">Akkustand</div>
            <div id="val-battery" style="font-size: 24px; font-weight: 700; margin-top: 4px;">--%</div>
        </div>
        <div style="background: #222233; padding: 12px; border-radius: 10px;">
            <div style="font-size: 11px; color: #888; text-transform: uppercase;">Reinigungsfortschritt</div>
            <div id="val-percent" style="font-size: 24px; font-weight: 700; margin-top: 4px;">--%</div>
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <button onclick="sendCommand('start')" style="flex: 1; background: #10B981; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Start</button>
        <button onclick="sendCommand('pause')" style="flex: 1; background: #374151; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Pause</button>
        <button onclick="sendCommand('home')" style="flex: 1; background: #374151; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Dock</button>
    </div>
</div>
<script>
    function handleMessage(data) {
        if (data.battery !== undefined) document.getElementById('val-battery').innerText = data.battery + '%';
        if (data.clean_percent !== undefined) document.getElementById('val-percent').innerText = data.clean_percent + '%';
        if (data.state !== undefined) document.getElementById('badge-status').innerText = data.state;
    }

    function sendCommand(cmd) {
        window.parent.postMessage({action: 'command', value: cmd}, '*');
    }
</script>
